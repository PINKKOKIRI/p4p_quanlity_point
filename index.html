<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>เบิก P4P Quality Point</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600;700&display=swap">
<style>
/* Layout: แถบแท็บ 5 หน้า (เบิก / ระบบงาน / ภาพรวมกลุ่ม / เกณฑ์ / เอกสาร) ข้อมูลใช้ร่วมกันทั้งกลุ่ม โทนเขียวเข้มแบบสมุดบัญชี */
:root {
  --bg: #edf0ec;
  --surface: #fbfcfa;
  --fg: #1b2420;
  --muted: #5b6761;
  --line: #d2d9d1;
  --accent: #0e6b57;
  --accent-fg: #ffffff;
  --accent-soft: #dcebe4;
  --warn: #8f5500;
  --warn-soft: #f7ead0;
  --danger: #a22f2f;
  --field: #ffffff;
  --font-body: 'IBM Plex Sans Thai', 'Sarabun', 'Noto Sans Thai', Tahoma, system-ui, sans-serif;
  --font-display: 'Noto Serif Thai', 'Sarabun', 'Noto Serif', Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111713; --surface: #19211c; --fg: #e5ece7; --muted: #9ba8a0; --line: #2c3731;
    --accent: #52c5a3; --accent-fg: #0a1a13; --accent-soft: #1d3a30;
    --warn: #e6b45f; --warn-soft: #382c14; --danger: #f29393; --field: #141b17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111713; --surface: #19211c; --fg: #e5ece7; --muted: #9ba8a0; --line: #2c3731;
  --accent: #52c5a3; --accent-fg: #0a1a13; --accent-soft: #1d3a30;
  --warn: #e6b45f; --warn-soft: #382c14; --danger: #f29393; --field: #141b17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.25; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.top { display: flex; flex-direction: column; gap: 14px; }
.hdr { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.month-pick { width: 180px; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--line); }
.tabs a {
  text-align: center; padding: 10px 4px; text-decoration: none; color: var(--muted); font-weight: 500;
  border-bottom: 3px solid transparent; margin-bottom: -1px; font-size: 14.5px;
}
.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tabs a:hover { color: var(--fg); }

.banner {
  background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
  padding: 10px 14px; border-radius: 6px; font-size: 14px;
}
.banner[hidden] { display: none; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
.hint { color: var(--muted); font-size: 13.5px; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; min-width: 0; }
input[type=text], input[type=number], input[type=month], select, textarea {
  font: inherit; font-size: 15px; color: var(--fg); background: var(--field); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0;
}
input:disabled, select:disabled, textarea:disabled { opacity: .6; cursor: not-allowed; }
textarea { min-height: 92px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }

button {
  font: inherit; font-size: 14.5px; font-weight: 500; cursor: pointer; border-radius: 6px; padding: 8px 14px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
button:hover { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.primary:hover { filter: brightness(1.06); }
button.danger-link { border: none; background: none; color: var(--danger); padding: 6px 8px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

.claim-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.summary { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 860px) {
  .claim-grid { grid-template-columns: minmax(0, 1fr); }
  .summary { position: static; order: -1; }
}

.sys-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.sys { border-top: 1px solid var(--line); }
.sys:first-child { border-top: none; }
.sys.on { background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.sys.locked { background: color-mix(in srgb, var(--muted) 8%, var(--surface)); }
.sys.locked .sys-name, .sys.locked .rate { opacity: .65; }
.sys.conflict { background: color-mix(in srgb, var(--danger) 9%, var(--surface)); }
.sys-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 11px 14px; cursor: pointer; }
.sys.locked .sys-head { cursor: not-allowed; }
.sys-head input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.sys-name { flex: 1 1 140px; min-width: 0; overflow-wrap: anywhere; }
.rate { color: var(--muted); font-size: 14px; }
.chip {
  display: inline-block; min-width: 34px; text-align: center; font-size: 12.5px; font-weight: 600; padding: 1px 8px;
  border-radius: 4px; color: var(--fg);
}
.sz-SS { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.sz-S  { background: color-mix(in srgb, var(--accent) 20%, var(--surface)); }
.sz-M  { background: color-mix(in srgb, var(--accent) 32%, var(--surface)); }
.sz-L  { background: color-mix(in srgb, var(--accent) 48%, var(--surface)); }
.sz-XL { background: var(--accent); color: var(--accent-fg); }
.pill { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 1px 9px; border-radius: 10px; white-space: nowrap; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.muted { background: color-mix(in srgb, var(--muted) 16%, var(--surface)); color: var(--fg); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.danger { background: color-mix(in srgb, var(--danger) 15%, var(--surface)); color: var(--danger); }

.sys-detail { display: flex; flex-direction: column; gap: 14px; padding: 0 14px 14px 44px; }
.sys-top { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; align-items: end; }
.amt { font-weight: 600; font-size: 16px; text-align: right; padding-bottom: 8px; white-space: nowrap; }
.tasks { display: flex; flex-direction: column; gap: 8px; }
.tasks-head { font-size: 13px; color: var(--muted); font-weight: 500; }
.task { display: grid; grid-template-columns: 2.6em minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.tno { font-size: 13px; color: var(--accent); font-weight: 600; }
@media (max-width: 560px) {
  .sys-detail { padding-left: 14px; }
  .task { grid-template-columns: 2.6em minmax(0, 1fr) auto; }
  .task .tref { grid-column: 2 / 4; }
}

.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 22px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; color: var(--muted); }

.sum-label { font-size: 13px; color: var(--muted); }
.net { font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: 1.1; color: var(--accent); }
.net small { font-size: 18px; margin-right: 4px; font-weight: 600; }
.bar { height: 8px; border-radius: 4px; background: var(--accent-soft); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.kv { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.kv div { display: flex; justify-content: space-between; gap: 12px; }
.kv .k { color: var(--muted); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.checks li { display: flex; gap: 8px; align-items: baseline; }
.checks li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); transform: translateY(-1px); }
.checks li.ok::before { background: var(--accent); }
.checks li.info::before { background: var(--muted); }
.checks li.bad::before { background: var(--danger); }

table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.t th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t td.r, table.t th.r { text-align: right; }
table.t tr.bad td { background: color-mix(in srgb, var(--danger) 9%, var(--surface)); }
.scroll-x { overflow-x: auto; max-width: 100%; }
.ratebar { height: 10px; background: var(--accent); border-radius: 2px; min-width: 4px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--surface); }
.stat b { display: block; font-family: var(--font-display); font-size: 24px; line-height: 1.2; }
.stat span { font-size: 13px; color: var(--muted); }
.stat.bad b { color: var(--danger); }

.rules { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; counter-reset: rule; }
.rules li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; counter-increment: rule; }
.rules li::before {
  content: counter(rule); font-weight: 600; color: var(--accent); background: var(--accent-soft);
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-variant-numeric: tabular-nums;
}
.rules b { display: block; font-weight: 600; }
.rules span { color: var(--muted); }
.formula { font-family: var(--font-display); font-size: 17px; background: var(--accent-soft); padding: 12px 14px; border-radius: 6px; overflow-wrap: anywhere; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.open-items { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

.sys-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px auto; gap: 8px; align-items: center; }
.sys-rows { display: flex; flex-direction: column; gap: 8px; }
.add-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px auto; gap: 8px; }
@media (max-width: 520px) { .sys-row, .add-row { grid-template-columns: minmax(0, 1fr) 84px; } .sys-row button, .add-row button { grid-column: 1 / -1; } }
.size-summary { display: flex; flex-wrap: wrap; gap: 8px; }
.ro-list { display: flex; flex-direction: column; }
.ro-item { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.ro-item:first-child { border-top: none; }
.ro-item .nm { flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; }
.status { font-size: 13.5px; color: var(--muted); min-height: 20px; }

.paper-wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 16px; }
.paper-wrap .doc { min-width: 640px; max-width: 820px; margin: 0 auto; box-shadow: 0 1px 3px rgba(0,0,0,.25); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 14px; max-width: calc(100% - 32px);
  z-index: 20; box-shadow: 0 4px 14px rgba(0,0,0,.3);
}
.toast[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) { .bar > span { transition: width .25s ease; } }
</style>

<style id="doc-css">
.doc { --pb: #ffffff; --pi: #1b1f1d; --pm: #55605a; --pl: #c4cbc6; --pa: #0e6b57;
  background: var(--pb); color: var(--pi); font-family: 'IBM Plex Sans Thai', 'Sarabun', Tahoma, sans-serif;
  font-size: 14px; line-height: 1.55; padding: 30px 34px; }
.doc * { box-sizing: border-box; }
.doc .d-title { font-family: 'Noto Serif Thai', 'Sarabun', serif; font-size: 22px; font-weight: 700; text-align: center; margin: 0; }
.doc .d-sub { text-align: center; color: var(--pm); margin: 2px 0 18px; }
.doc .d-info { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; margin-bottom: 16px; }
.doc .d-info div { display: flex; gap: 8px; border-bottom: 1px dotted var(--pl); padding-bottom: 3px; min-height: 26px; }
.doc .d-info .k { color: var(--pm); white-space: nowrap; }
.doc table { width: 100%; border-collapse: collapse; }
.doc th { background: #eef2ef; font-size: 12.5px; text-align: left; padding: 6px 8px; border: 1px solid var(--pl); }
.doc td { padding: 6px 8px; border: 1px solid var(--pl); vertical-align: top; }
.doc .r { text-align: right; font-variant-numeric: tabular-nums; }
.doc .c { text-align: center; }
.doc tfoot td { font-weight: 600; background: #f7f9f8; }
.doc tr.sys td { background: #f7f9f8; font-weight: 600; }
.doc tr.sub td { font-size: 12.5px; padding-top: 4px; padding-bottom: 4px; }
.doc tr.sub td.nm { padding-left: 18px; }
.doc .d-total { margin: 14px 0 4px; border: 1.5px solid var(--pa); padding: 10px 14px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.doc .d-total .big { font-size: 20px; font-weight: 700; color: var(--pa); font-variant-numeric: tabular-nums; }
.doc .d-words { color: var(--pm); margin-bottom: 26px; }
.doc .d-sign { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 36px; text-align: center; }
.doc .d-sign .line { border-bottom: 1px dotted var(--pi); height: 38px; }
.doc .d-sign small { display: block; color: var(--pm); margin-top: 2px; }
.doc .muted { color: var(--pm); }
</style>

<div class="page">
  <header class="top">
    <div class="hdr">
      <div>
        <div class="eyebrow">ใบเบิกประจำเดือน</div>
        <h1>เบิก P4P Quality Point</h1>
      </div>
      <label class="f month-pick">เดือนที่เบิก<input type="month" id="f-month" aria-label="เดือนที่เบิก"></label>
    </div>
    <nav class="tabs" id="tabs" aria-label="เมนู">
      <a href="#claim" data-tab="claim">เบิก</a>
      <a href="#systems" data-tab="systems">ระบบงาน</a>
      <a href="#group" data-tab="group">ภาพรวม</a>
      <a href="#rules" data-tab="rules">เกณฑ์</a>
      <a href="#doc" data-tab="doc">เอกสาร</a>
    </nav>
  </header>
  <div class="banner" id="banner" role="status" hidden></div>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';
  var SIZES = [{ k: 'SS', v: 1000 }, { k: 'S', v: 2000 }, { k: 'M', v: 3000 }, { k: 'L', v: 4000 }, { k: 'XL', v: 5000 }];
  var PRICE = {}; SIZES.forEach(function (s) { PRICE[s.k] = s.v; });
  var TH_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  var TABS = ['claim', 'systems', 'group', 'rules', 'doc'];
  var PROFILE_KEY = 'p4p-profile-v2';

  // ---------- helpers ----------
  function nid() { return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function round2(n) { return Math.round(n * 100) / 100; }
  function fmt(n) {
    n = round2(+n || 0);
    return Number.isInteger(n) ? n.toLocaleString('en-US') : n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function iso() { return new Date().toISOString(); }
  function nowMonth() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function validMonth(m) { return /^\d{4}-(0[1-9]|1[0-2])$/.test(m); }
  function fmtMonth(m) { var p = m.split('-'); return TH_MONTHS[+p[1] - 1] + ' ' + (+p[0] + 543); }
  function prevMonthKey(m) { var p = m.split('-'), y = +p[0], mo = +p[1] - 1; if (mo < 1) { mo = 12; y -= 1; } return y + '-' + String(mo).padStart(2, '0'); }
  //BT-START
  function readInt(s) {
    if (s.length > 6) return readInt(s.slice(0, -6)) + 'ล้าน' + readInt(s.slice(-6));
    var digits = ['ศูนย์', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
    var pos = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
    var out = '', len = s.length;
    for (var i = 0; i < len; i++) {
      var d = +s[i], p = len - i - 1;
      if (d === 0) continue;
      if (p === 0 && d === 1 && len > 1) out += 'เอ็ด';
      else if (p === 1 && d === 2) out += 'ยี่สิบ';
      else if (p === 1 && d === 1) out += 'สิบ';
      else out += digits[d] + pos[p];
    }
    return out;
  }
  function bahtText(n) {
    n = round2(n);
    var baht = Math.floor(n), satang = Math.round((n - baht) * 100);
    if (baht === 0 && satang === 0) return 'ศูนย์บาทถ้วน';
    var t = baht > 0 ? readInt(String(baht)) + 'บาท' : '';
    return t + (satang > 0 ? readInt(String(satang)) + 'สตางค์' : 'ถ้วน');
  }
  //BT-END

  // ---------- state ----------
  var S = {
    month: nowMonth(), status: 'connecting', db: null, user: null, uid: null, me: null,
    canWrite: null, isAdmin: false, loaded: { period: false, claims: false, slots: false }, slow: false,
    systems: [], claims: {}, slots: {}, my: null, names: {}, saveState: ''
  };
  var unsubs = [], slowTimer = null, namesKey = '';

  function loadProfile() { try { var p = JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null'); if (p && typeof p === 'object') return p; } catch (e) { /* ignore */ } return {}; }
  function rememberProfile() {
    if (!S.my) return;
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify({ name: S.my.name, dept: S.my.dept, fixRate: S.my.fixRate, capMode: S.my.capMode })); } catch (e) { /* ignore */ }
  }
  function ro() { return S.canWrite === false; }
  function allLoaded() { return S.loaded.period && S.loaded.claims && S.loaded.slots; }

  function initMy() {
    var d = S.claims[S.uid], base = loadProfile();
    if (d) S.my = clone(d);
    else S.my = { month: S.month, uid: S.uid, name: base.name || (S.me && S.me.name) || '', dept: base.dept || '', fixRate: +base.fixRate || 0, capMode: base.capMode === 'none' ? 'none' : 'cap', items: {} };
    if (!S.my.items) S.my.items = {};
    Object.keys(S.my.items).forEach(function (id) {
      var c = S.my.items[id];
      if (!Array.isArray(c.tasks) || !c.tasks.length) c.tasks = [{ id: nid(), title: '', ref: '' }];
    });
  }
  function claimOf(uid) { return uid === S.uid ? S.my : S.claims[uid]; }
  function nameOf(uid) {
    if (uid === S.uid && S.my && S.my.name) return S.my.name;
    var c = S.claims[uid]; if (c && c.name) return c.name;
    return S.names[uid] || 'ผู้ร่วมงาน';
  }
  function itemOwners(id) {
    var o = [];
    Object.keys(S.claims).forEach(function (u) { if (u !== S.uid) { var c = S.claims[u]; if (c && c.items && c.items[id]) o.push(u); } });
    if (S.my && S.my.items && S.my.items[id]) o.push(S.uid);
    return o;
  }
  function othersFor(id) {
    var o = itemOwners(id).filter(function (u) { return u !== S.uid; });
    var sl = S.slots[id];
    if (sl && sl.owner && sl.owner !== S.uid && o.indexOf(sl.owner) < 0) o.push(sl.owner);
    return o;
  }
  function names(list) { return list.map(nameOf).join(', '); }
  function sysById(id) { return S.systems.filter(function (s) { return s.id === id; })[0]; }

  function computeFor(claim) {
    var items = (claim && claim.items) || {}, lines = [];
    S.systems.forEach(function (s) {
      var c = items[s.id]; if (!c) return;
      var share = Math.max(0, Math.min(100, parseFloat(c.share) || 0));
      var rate = PRICE[s.size] || 0;
      var tasks = (c.tasks || []).filter(function (t) { return (t.title || '').trim() || (t.ref || '').trim(); })
        .map(function (t) { return { title: (t.title || '').trim(), ref: (t.ref || '').trim() }; });
      lines.push({ id: s.id, name: s.name, size: s.size, rate: rate, share: share, tasks: tasks, amount: round2(rate * share / 100) });
    });
    var total = round2(lines.reduce(function (a, l) { return a + l.amount; }, 0));
    var fix = +(claim && claim.fixRate) || 0;
    var cap = !!claim && claim.capMode !== 'none' && fix > 0;
    var net = cap ? Math.min(total, fix) : total;
    return { lines: lines, total: total, fix: fix, cap: cap, net: round2(net), over: cap ? round2(Math.max(0, total - fix)) : 0 };
  }
  function compute() { return computeFor(S.my); }
  function missingRefs(c) { var n = 0; c.lines.forEach(function (l) { l.tasks.forEach(function (t) { if (!t.ref) n += 1; }); }); return n; }

  function checks(c) {
    var out = [], m = S.my || {};
    var clash = [];
    c.lines.forEach(function (l) { var o = othersFor(l.id); if (o.length) clash.push(l.name + ' ซ้ำกับ ' + names(o)); });
    clash.forEach(function (t) { out.push(['bad', t]); });
    var orphan = Object.keys(m.items || {}).filter(function (id) { return !sysById(id); }).length;
    if (orphan) out.push(['warn', orphan + ' รายการที่เลือกไว้ ไม่อยู่ในรายการระบบของเดือนนี้แล้ว']);
    if (!(m.name || '').trim()) out.push(['warn', 'ยังไม่ได้กรอกชื่อผู้เบิก']);
    if (m.capMode !== 'none' && !(+m.fixRate > 0)) out.push(['warn', 'ยังไม่ได้กรอก fix rate จึงยังไม่จำกัดยอดเบิก']);
    if (!c.lines.length) out.push(['warn', 'ยังไม่ได้เลือกงานที่ทำ']);
    var noTask = c.lines.filter(function (l) { return !l.tasks.length; }).length;
    if (noTask) out.push(['warn', noTask + ' ระบบยังไม่ระบุงานย่อย']);
    var noRef = missingRefs(c);
    if (noRef) out.push(['warn', noRef + ' งานย่อยยังไม่มีหลักฐานอ้างอิง']);
    if (c.over > 0) out.push(['info', 'งานรวมเกิน fix rate อยู่ ' + fmt(c.over) + ' บาท เบิกได้เท่ากับ fix rate']);
    if (!out.some(function (x) { return x[0] === 'warn' || x[0] === 'bad'; })) out.unshift(['ok', 'ข้อมูลครบ ไม่มีระบบซ้ำ พร้อมส่งออกเอกสาร']);
    return out;
  }

  // ---------- saving ----------
  var saveTimer = null, saving = false, savePending = false, myDirty = false;
  var perTimer = null, perSaving = false, perDirty = false, perVer = 0;
  function setSaveState(t) {
    S.saveState = t;
    var el = document.getElementById('savestate'); if (el) el.textContent = t;
    var h = document.getElementById('save-hint'); if (h) h.textContent = t;
  }
  function writeFailed(e) {
    if (e && e.code === 'invalid_argument') { S.canWrite = false; toast('บัญชีนี้บันทึกข้อมูลไม่ได้ ขอสิทธิ์ผู้ร่วมแก้ไขจากผู้ดูแล'); render(); }
    else toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');
    setSaveState('บันทึกไม่สำเร็จ');
  }
  function scheduleSave(delay) {
    if (!S.my || ro()) return;
    myDirty = true; setSaveState('กำลังบันทึก...');
    clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, delay == null ? 700 : delay);
  }
  function flushSave() {
    saveTimer = null;
    if (!S.db || !S.my || ro()) return;
    if (saving) { savePending = true; return; }
    saving = true; myDirty = false;
    var body = clone(S.my); body.month = S.month; body.uid = S.uid; body.updatedAt = iso();
    S.db.doc('claims/' + S.month + '_' + S.uid).set(body).then(function () {
      saving = false; if (!savePending && !myDirty) setSaveState('บันทึกแล้ว');
      if (savePending) { savePending = false; flushSave(); }
    }, function (e) { saving = false; savePending = false; writeFailed(e); });
  }
  function schedulePeriod(delay) {
    if (!S.isAdmin || ro()) return;
    perDirty = true; perVer += 1; setSaveState('กำลังบันทึก...');
    clearTimeout(perTimer); perTimer = setTimeout(flushPeriod, delay == null ? 700 : delay);
  }
  function flushPeriod() {
    perTimer = null;
    if (!S.db || !S.isAdmin) return;
    if (perSaving) { perTimer = setTimeout(flushPeriod, 300); return; }
    perSaving = true;
    var v = perVer;
    S.db.doc('periods/' + S.month).set({ month: S.month, systems: clone(S.systems), updatedAt: iso() }).then(function () {
      perSaving = false; if (perVer === v) { perDirty = false; setSaveState('บันทึกแล้ว'); }
    }, function (e) { perSaving = false; writeFailed(e); });
  }
  function flushAll() {
    if (perDirty) { clearTimeout(perTimer); flushPeriod(); }
    if (myDirty) { clearTimeout(saveTimer); flushSave(); }
  }

  // ---------- slots (จองระบบกันซ้ำ) ----------
  function slotRef(id) { return S.db.doc('slots/' + S.month + '_' + id); }
  function claimSlot(id) {
    var ref = slotRef(id);
    return ref.acquire({ holder: S.uid, ttlMs: 8000 }).then(function (r) {
      if (!r.acquired) return { ok: false, reason: 'busy' };
      return ref.get().then(function (snap) {
        var d = snap.exists ? snap.data() : null;
        if (d && d.owner && d.owner !== S.uid) return { ok: false, reason: 'taken', owner: d.owner };
        return ref.set({ month: S.month, sysId: id, owner: S.uid, at: iso() }).then(function () { return { ok: true }; });
      });
    });
  }
  function releaseSlot(id) {
    var ref = slotRef(id);
    return ref.get().then(function (snap) {
      var d = snap.exists ? snap.data() : null;
      if (d && d.owner === S.uid) return ref.delete();
    }).catch(function () { /* ignore */ });
  }

  // ---------- subscriptions ----------
  function unsubscribeAll() { unsubs.forEach(function (f) { try { f(); } catch (e) { /* ignore */ } }); unsubs = []; }
  function subscribe() {
    unsubscribeAll();
    S.loaded = { period: false, claims: false, slots: false }; S.slow = false;
    S.systems = []; S.claims = {}; S.slots = {}; S.my = null; namesKey = '';
    clearTimeout(slowTimer); slowTimer = setTimeout(function () { if (!allLoaded()) { S.slow = true; renderBanner(); } }, 10000);
    var m = S.month;
    function onErr(e) { if (e && e.code === 'revoked') { S.status = 'nodb'; } else { S.slow = true; } render(); }
    unsubs.push(S.db.doc('periods/' + m).onSnapshot(function (snap) {
      if (m !== S.month) return;
      S.loaded.period = true;
      if (!perDirty) { var d = snap.exists ? snap.data() : null; S.systems = d && Array.isArray(d.systems) ? clone(d.systems) : []; }
      onData();
    }, onErr));
    unsubs.push(S.db.collection('claims').where('month', '==', m).onSnapshot(function (q) {
      if (m !== S.month) return;
      var next = {}; q.docs.forEach(function (d) { var v = d.data(); if (v && v.uid) next[v.uid] = clone(v); });
      S.claims = next; S.loaded.claims = true;
      if (!S.my) initMy();
      onData();
    }, onErr));
    unsubs.push(S.db.collection('slots').where('month', '==', m).onSnapshot(function (q) {
      if (m !== S.month) return;
      var next = {}; q.docs.forEach(function (d) { var v = d.data(); if (v && v.sysId && v.owner) next[v.sysId] = { owner: v.owner }; });
      S.slots = next; S.loaded.slots = true;
      onData();
    }, onErr));
  }
  function onData() {
    if (allLoaded()) { clearTimeout(slowTimer); S.slow = false; resolveNames(); }
    refresh();
  }
  function resolveNames() {
    if (!S.user) return;
    var ids = Object.keys(S.claims);
    Object.keys(S.slots).forEach(function (k) { var o = S.slots[k].owner; if (ids.indexOf(o) < 0) ids.push(o); });
    var key = ids.slice().sort().join('|'); if (key === namesKey || !ids.length) return; namesKey = key;
    S.user.profiles(ids).then(function (ps) {
      var changed = false;
      ids.forEach(function (i) { var n = ps[i] && ps[i].name; if (n && S.names[i] !== n) { S.names[i] = n; changed = true; } });
      if (changed) refresh();
    }, function () { /* ignore */ });
  }

  function summaryHtml() {

  function tasksHtml(s, c, no) {

      '<label class="f">วิธีใช้ fix rate<select id="f-cap" data-bind="capMode"' + dis() + '><option value="cap"' + (m.capMode !== 'none' ? ' selected' : '') + '>เป็นเพดานยอดเบิก</option><option value="none"' + (m.capMode === 'none' ? ' selected' : '') + '>ไม่จำกัดยอด</option></select></label>' +
      '</div></section>' +
      '<section class="panel"><div class="panel-head"><h2>งานที่ทำเดือนนี้</h2><span class="hint">ติ๊กระบบที่ทำ ระบบที่มีคนเลือกแล้วจะเลือกซ้ำไม่ได้</span></div>' +

  function viewSystems() {

      return '<section class="panel">' + title + '<p class="hint">รายการนี้ผู้ดูแลเป็นผู้ประกาศและแก้ไข</p><div class="ro-list">' + items + '</div>' +
        '<div class="btn-row"><button type="button" data-act="copy-systems">คัดลอกรายการเดือนนี้</button></div></section>';
    }
    var rows = S.systems.map(function (s) {

        '<button type="button" class="danger-link" data-act="del-sys" data-id="' + s.id + '"' + dis(claimed) + (claimed ? ' title="มีผู้เบิกแล้ว ให้ผู้เบิกยกเลิกก่อน"' : '') + '>' + (claimed ? 'มีผู้เบิกแล้ว' : 'ลบ') + '</button></div>';
    }).join('') || '<div class="empty"><p>ยังไม่มีระบบงานของ ' + esc(fmtMonth(S.month)) + '</p><p class="hint">เพิ่มทีละรายการด้านล่าง หรือวางรายการทั้งชุดในช่องนำเข้า เมื่อบันทึกแล้วทุกคนในกลุ่มจะเห็นทันที</p></div>';
    return '<div class="two"><section class="panel">' + title +

      '<p class="hint" id="save-hint">' + esc(S.saveState) + '</p></section>' +

      if (tk) { tk[b === 'ttitle' ? 'title' : 'ref'] = t.value; mine = true; }
    }
    else if (b === 'sysname') { var s = sysById(id); if (s) { s.name = t.value; schedulePeriod(); } return; }
    else return;
    if (mine) { scheduleSave(); updateDerived(); }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'f-month') {
      if (!validMonth(t.value)) { toast('กรอกเดือนในรูปแบบ ปปปป-ดด'); return; }
      if (S.status === 'ready') { flushAll(); }
      S.month = t.value; setSaveState('');
      if (S.status === 'ready') subscribe();
      render(); return;
    }
    if (t.dataset.act === 'toggle') {
      var id = t.dataset.id;
      if (t.checked) {
        t.disabled = true;
        claimSlot(id).then(function (r) {
          if (r.ok) {
            var first = { id: nid(), title: '', ref: '' };
            S.my.items[id] = { share: 100, tasks: [first] };
            scheduleSave(0); render('tt-' + first.id);
          } else {
            toast(r.reason === 'busy' ? 'มีคนกำลังเลือกระบบนี้อยู่ ลองใหม่อีกครั้ง' : 'ระบบนี้มีผู้เบิกแล้ว เลือกซ้ำไม่ได้');
            render();
          }
        }, function (err) { writeFailed(err); render(); });
      } else {
        delete S.my.items[id]; scheduleSave(0); releaseSlot(id); render('chk-' + id);
      }
      return;
    }
    var b = t.dataset.bind;
    if (b === 'capMode') { S.my.capMode = t.value; rememberProfile(); scheduleSave(); updateDerived(); }
    else if (b === 'syssize') { var s = sysById(t.dataset.id); if (s) { s.size = t.value; schedulePeriod(); updateDerived(); } }
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'add-form') return;
    e.preventDefault();
    var n = document.getElementById('add-name'), sz = document.getElementById('add-size');
    if (!n.value.trim() || !S.isAdmin) return;
    S.systems.push({ id: nid(), name: n.value.trim(), size: sz.value });
    schedulePeriod(0); render('add-name');
  });

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null; if (!el) return;
    var act = el.dataset.act;
    if (act === 'go') { location.hash = el.dataset.go; return; }
    if (act === 'add-task') {
      var cl = S.my.items[el.dataset.id];
      if (cl) { var nt = { id: nid(), title: '', ref: '' }; cl.tasks.push(nt); scheduleSave(0); render('tt-' + nt.id); }
      return;
    }
    if (act === 'del-task') {
      var cl2 = S.my.items[el.dataset.id];
      if (cl2) {
        cl2.tasks = cl2.tasks.length > 1 ? cl2.tasks.filter(function (x) { return x.id !== el.dataset.tid; }) : [{ id: nid(), title: '', ref: '' }];
        scheduleSave(0); render();
      }
      return;
    }
    if (act === 'del-sys') {
      if (!S.isAdmin) return;
      S.systems = S.systems.filter(function (s) { return s.id !== el.dataset.id; });
      schedulePeriod(0); render(); return;
    }
    if (act === 'import') {
      var r = importLines(document.getElementById('bulk').value);
      if (r.added) schedulePeriod(0);
      render();
      setStatus('เพิ่ม ' + r.added + ' ระบบ' + (r.skipped ? ' ข้าม ' + r.skipped + ' บรรทัดที่ไม่มีขนาด (SS S M L XL)' : ''));
      return;
    }
    if (act === 'copy-systems') {
      if (!S.systems.length) { toast('ยังไม่มีรายการให้คัดลอก'); return; }
      copyText(S.systems.map(function (s) { return s.name + ', ' + s.size; }).join('\n'), 'คัดลอกรายการระบบแล้ว'); return;
    }
    if (act === 'copy-prev') {
      var pm = prevMonthKey(S.month);
      S.db.doc('periods/' + pm).get().then(function (snap) {
        var d = snap.exists ? snap.data() : null;
        if (!d || !Array.isArray(d.systems) || !d.systems.length) { setStatus('ไม่พบรายการของ ' + fmtMonth(pm)); return; }
        d.systems.forEach(function (x) { S.systems.push({ id: nid(), name: x.name, size: x.size }); });
        schedulePeriod(0); render();
        setStatus('คัดลอก ' + d.systems.length + ' ระบบจาก ' + fmtMonth(pm) + ' แล้ว แก้ชื่อและขนาดให้ตรงกับเดือนนี้');
      }, function () { setStatus('อ่านรายการเดือนก่อนไม่สำเร็จ'); });
      return;
    }
    if (act === 'release-slot') {
      if (!S.isAdmin) return;
      slotRef(el.dataset.id).delete().then(function () { toast('ปล่อยระบบแล้ว'); }, writeFailed); return;
    }
    if (act === 'copy-table') { copyText(toTsv(), 'คัดลอกตารางแล้ว วางใน Excel หรือ Word ได้'); return; }
    if (act === 'save-csv') { saveFile('P4P-' + S.month + '.csv', toCsv(), 'บันทึกไฟล์ CSV แล้ว'); return; }
    if (act === 'save-html') { saveFile('P4P-' + S.month + '.html', docFile(), 'บันทึกเอกสารแล้ว เปิดไฟล์แล้วกด Ctrl+P เพื่อพิมพ์หรือบันทึกเป็น PDF'); return; }
  });

  window.addEventListener('hashchange', function () { render(); });

  // ---------- boot ----------
  function boot() {
    var cl = window.claude;
    if (!cl || !cl.use) { S.status = 'nodb'; render(); return; }
    Promise.all([cl.use('db'), cl.use('user')]).then(function (r) {
      S.db = r[0]; S.user = r[1];
      if (!S.db || !S.user) { S.status = 'nodb'; render(); return; }
      return Promise.all([S.user.id(), S.user.canEdit(), S.user.can('data.write'), S.user.me()]).then(function (v) {
        S.uid = v[0]; S.isAdmin = !!v[1]; S.canWrite = v[2]; S.me = v[3];
        if (!S.uid) { S.status = 'noid'; render(); return; }
        S.status = 'ready'; subscribe(); render();
      });
    }).catch(function () { S.status = 'nodb'; render(); });
  }
  document.getElementById('f-month').value = S.month;
  render();
  boot();
})();
</script>

</body></html>
