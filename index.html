<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>เบิก P4P Quality Point</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600;700&display=swap">
<style>
/* Layout: แถบแท็บ 4 หน้า (เบิก / ระบบงาน / เกณฑ์ / เอกสาร) ฟอร์มซ้าย สรุปยอดขวา ใช้โทนเขียวเข้มแบบสมุดบัญชี */
:root {
  --bg: #edf0ec;
  --surface: #fbfcfa;
  --fg: #1b2420;
  --muted: #5b6761;
  --line: #d2d9d1;
  --accent: #0e6b57;
  --accent-fg: #ffffff;
  --accent-soft: #dcebe4;
  --warn: #8f5500;
  --warn-soft: #f7ead0;
  --danger: #a22f2f;
  --field: #ffffff;
  --font-body: 'IBM Plex Sans Thai', 'Sarabun', 'Noto Sans Thai', Tahoma, system-ui, sans-serif;
  --font-display: 'Noto Serif Thai', 'Sarabun', 'Noto Serif', Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111713; --surface: #19211c; --fg: #e5ece7; --muted: #9ba8a0; --line: #2c3731;
    --accent: #52c5a3; --accent-fg: #0a1a13; --accent-soft: #1d3a30;
    --warn: #e6b45f; --warn-soft: #382c14; --danger: #f29393; --field: #141b17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111713; --surface: #19211c; --fg: #e5ece7; --muted: #9ba8a0; --line: #2c3731;
  --accent: #52c5a3; --accent-fg: #0a1a13; --accent-soft: #1d3a30;
  --warn: #e6b45f; --warn-soft: #382c14; --danger: #f29393; --field: #141b17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.25; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.top { display: flex; flex-direction: column; gap: 14px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.tabs a {
  text-align: center; padding: 10px 4px; text-decoration: none; color: var(--muted); font-weight: 500;
  border-bottom: 3px solid transparent; margin-bottom: -1px; font-size: 14.5px;
}
.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tabs a:hover { color: var(--fg); }

.banner {
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between;
  background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
  padding: 10px 14px; border-radius: 6px; font-size: 14px;
}
.banner[hidden] { display: none; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
.hint { color: var(--muted); font-size: 13.5px; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; min-width: 0; }
input[type=text], input[type=number], input[type=month], select, textarea {
  font: inherit; font-size: 15px; color: var(--fg); background: var(--field); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0;
}
input:disabled, select:disabled, textarea:disabled { opacity: .6; cursor: not-allowed; }
textarea { min-height: 92px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }

button {
  font: inherit; font-size: 14.5px; font-weight: 500; cursor: pointer; border-radius: 6px; padding: 8px 14px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
button:hover { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.primary:hover { filter: brightness(1.06); }
button.danger-link { border: none; background: none; color: var(--danger); padding: 6px 8px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

.claim-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.summary { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 860px) {
  .claim-grid { grid-template-columns: minmax(0, 1fr); }
  .summary { position: static; order: -1; }
}

.sys-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.sys { border-top: 1px solid var(--line); }
.sys:first-child { border-top: none; }
.sys.on { background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.sys.locked { background: color-mix(in srgb, var(--muted) 8%, var(--surface)); }
.sys.locked .sys-name, .sys.locked .rate { opacity: .65; }
.sys.conflict { background: color-mix(in srgb, var(--danger) 9%, var(--surface)); }
.sys-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 11px 14px; cursor: pointer; }
.sys.locked .sys-head { cursor: not-allowed; }
.sys-head input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.sys-name { flex: 1 1 140px; min-width: 0; overflow-wrap: anywhere; }
.rate { color: var(--muted); font-size: 14px; }
.chip {
  display: inline-block; min-width: 34px; text-align: center; font-size: 12.5px; font-weight: 600; padding: 1px 8px;
  border-radius: 4px; color: var(--fg);
}
.sz-SS { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.sz-S  { background: color-mix(in srgb, var(--accent) 20%, var(--surface)); }
.sz-M  { background: color-mix(in srgb, var(--accent) 32%, var(--surface)); }
.sz-L  { background: color-mix(in srgb, var(--accent) 48%, var(--surface)); }
.sz-XL { background: var(--accent); color: var(--accent-fg); }

.sys-detail { display: flex; flex-direction: column; gap: 14px; padding: 0 14px 14px 44px; }
.sys-top { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; align-items: end; }
.amt { font-weight: 600; font-size: 16px; text-align: right; padding-bottom: 8px; white-space: nowrap; }
.tasks { display: flex; flex-direction: column; gap: 8px; }
.tasks-head { font-size: 13px; color: var(--muted); font-weight: 500; }
.task { display: grid; grid-template-columns: 2.6em minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.tno { font-size: 13px; color: var(--accent); font-weight: 600; }
@media (max-width: 560px) {
  .sys-detail { padding-left: 14px; }
  .task { grid-template-columns: 2.6em minmax(0, 1fr) auto; }
  .task .tref { grid-column: 2 / 4; }
}

.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 22px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; color: var(--muted); }

.sum-label { font-size: 13px; color: var(--muted); }
.net { font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: 1.1; color: var(--accent); }
.net small { font-size: 18px; margin-right: 4px; font-weight: 600; }
.bar { height: 8px; border-radius: 4px; background: var(--accent-soft); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.kv { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.kv div { display: flex; justify-content: space-between; gap: 12px; }
.kv .k { color: var(--muted); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.checks li { display: flex; gap: 8px; align-items: baseline; }
.checks li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); transform: translateY(-1px); }
.checks li.ok::before { background: var(--accent); }
.checks li.info::before { background: var(--muted); }

table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.t th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t td.r, table.t th.r { text-align: right; }
.scroll-x { overflow-x: auto; max-width: 100%; }
.ratebar { height: 10px; background: var(--accent); border-radius: 2px; min-width: 4px; }

.rules { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; counter-reset: rule; }
.rules li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; counter-increment: rule; }
.rules li::before {
  content: counter(rule); font-weight: 600; color: var(--accent); background: var(--accent-soft);
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-variant-numeric: tabular-nums;
}
.rules b { display: block; font-weight: 600; }
.rules span { color: var(--muted); }
.formula { font-family: var(--font-display); font-size: 17px; background: var(--accent-soft); padding: 12px 14px; border-radius: 6px; overflow-wrap: anywhere; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.open-items { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

.sys-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px auto; gap: 8px; align-items: center; }
.sys-rows { display: flex; flex-direction: column; gap: 8px; }
.add-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px auto; gap: 8px; }
@media (max-width: 520px) { .sys-row, .add-row { grid-template-columns: minmax(0, 1fr) 84px; } .sys-row button, .add-row button { grid-column: 1 / -1; } }
.size-summary { display: flex; flex-wrap: wrap; gap: 8px; }
.status { font-size: 13.5px; color: var(--muted); min-height: 20px; }

.paper-wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 16px; }
.paper-wrap .doc { min-width: 640px; max-width: 820px; margin: 0 auto; box-shadow: 0 1px 3px rgba(0,0,0,.25); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 14px; max-width: calc(100% - 32px);
  z-index: 20; box-shadow: 0 4px 14px rgba(0,0,0,.3);
}
.toast[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) { .bar > span { transition: width .25s ease; } }
</style>

<style id="doc-css">
.doc { --pb: #ffffff; --pi: #1b1f1d; --pm: #55605a; --pl: #c4cbc6; --pa: #0e6b57;
  background: var(--pb); color: var(--pi); font-family: 'IBM Plex Sans Thai', 'Sarabun', Tahoma, sans-serif;
  font-size: 14px; line-height: 1.55; padding: 30px 34px; }
.doc * { box-sizing: border-box; }
.doc .d-title { font-family: 'Noto Serif Thai', 'Sarabun', serif; font-size: 22px; font-weight: 700; text-align: center; margin: 0; }
.doc .d-sub { text-align: center; color: var(--pm); margin: 2px 0 18px; }
.doc .d-info { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; margin-bottom: 16px; }
.doc .d-info div { display: flex; gap: 8px; border-bottom: 1px dotted var(--pl); padding-bottom: 3px; min-height: 26px; }
.doc .d-info .k { color: var(--pm); white-space: nowrap; }
.doc table { width: 100%; border-collapse: collapse; }
.doc th { background: #eef2ef; font-size: 12.5px; text-align: left; padding: 6px 8px; border: 1px solid var(--pl); }
.doc td { padding: 6px 8px; border: 1px solid var(--pl); vertical-align: top; }
.doc .r { text-align: right; font-variant-numeric: tabular-nums; }
.doc .c { text-align: center; }
.doc tfoot td { font-weight: 600; background: #f7f9f8; }
.doc tr.sys td { background: #f7f9f8; font-weight: 600; }
.doc tr.sub td { font-size: 12.5px; padding-top: 4px; padding-bottom: 4px; }
.doc tr.sub td.nm { padding-left: 18px; }
.doc .d-total { margin: 14px 0 4px; border: 1.5px solid var(--pa); padding: 10px 14px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.doc .d-total .big { font-size: 20px; font-weight: 700; color: var(--pa); font-variant-numeric: tabular-nums; }
.doc .d-words { color: var(--pm); margin-bottom: 26px; }
.doc .d-sign { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 36px; text-align: center; }
.doc .d-sign .line { border-bottom: 1px dotted var(--pi); height: 38px; }
.doc .d-sign small { display: block; color: var(--pm); margin-top: 2px; }
.doc .muted { color: var(--pm); }
</style>

<div class="page">
  <header class="top">
    <div>
      <div class="eyebrow">ใบเบิกประจำเดือน</div>
      <h1>เบิก P4P Quality Point</h1>
    </div>
    <nav class="tabs" id="tabs" aria-label="เมนู">
      <a href="#claim" data-tab="claim">เบิก</a>
      <a href="#systems" data-tab="systems">ระบบงาน</a>
      <a href="#rules" data-tab="rules">เกณฑ์</a>
      <a href="#doc" data-tab="doc">เอกสาร</a>
    </nav>
  </header>
  <div class="banner" id="banner" hidden>
    <span>กำลังแสดงข้อมูลตัวอย่าง รายการระบบ งานที่เลือก และ fix rate ยังไม่ใช่ข้อมูลจริง</span>
    <button type="button" data-act="clear-example">ล้างตัวอย่างแล้วเริ่มใส่ข้อมูลจริง</button>
  </div>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';
  var SIZES = [{ k: 'SS', v: 1000 }, { k: 'S', v: 2000 }, { k: 'M', v: 3000 }, { k: 'L', v: 4000 }, { k: 'XL', v: 5000 }];
  var PRICE = {}; SIZES.forEach(function (s) { PRICE[s.k] = s.v; });
  var TH_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  var TABS = ['claim', 'systems', 'rules', 'doc'];
  var KEY = 'p4p-quality-point-v1';
  var seq = 0;
  function nid() { seq += 1; return 's' + Date.now().toString(36) + seq.toString(36); }

  // ---------- helpers ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function round2(n) { return Math.round(n * 100) / 100; }
  function fmt(n) {
    n = round2(+n || 0);
    return Number.isInteger(n) ? n.toLocaleString('en-US') : n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function nowMonth() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function validMonth(m) { return /^\d{4}-(0[1-9]|1[0-2])$/.test(m); }
  function fmtMonth(m) { var p = m.split('-'); return TH_MONTHS[+p[1] - 1] + ' ' + (+p[0] + 543); }
  //BT-START
  function readInt(s) {
    if (s.length > 6) return readInt(s.slice(0, -6)) + 'ล้าน' + readInt(s.slice(-6));
    var digits = ['ศูนย์', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
    var pos = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
    var out = '', len = s.length;
    for (var i = 0; i < len; i++) {
      var d = +s[i], p = len - i - 1;
      if (d === 0) continue;
      if (p === 0 && d === 1 && len > 1) out += 'เอ็ด';
      else if (p === 1 && d === 2) out += 'ยี่สิบ';
      else if (p === 1 && d === 1) out += 'สิบ';
      else out += digits[d] + pos[p];
    }
    return out;
  }
  function bahtText(n) {
    n = round2(n);
    var baht = Math.floor(n), satang = Math.round((n - baht) * 100);
    if (baht === 0 && satang === 0) return 'ศูนย์บาทถ้วน';
    var t = baht > 0 ? readInt(String(baht)) + 'บาท' : '';
    return t + (satang > 0 ? readInt(String(satang)) + 'สตางค์' : 'ถ้วน');
  }
  //BT-END

  // ---------- state ----------
  function seedState() {
    var m = nowMonth();
    var sys = [['ระบบนัดหมายออนไลน์', 'M'], ['ระบบรายงานตัวชี้วัด', 'L'], ['ระบบแจ้งซ่อมครุภัณฑ์', 'S'], ['ระบบคลังพัสดุ', 'XL'], ['ระบบจองห้องประชุม', 'SS'], ['ระบบประเมินบุคลากร', 'M']]
      .map(function (a) { return { id: nid(), name: a[0], size: a[1] }; });
    var claims = {};
    claims[sys[0].id] = { share: 100, tasks: [{ id: nid(), title: 'ปรับหน้าจอนัดหมาย', ref: 'ตัวอย่าง: ticket #1204' }, { id: nid(), title: 'แก้ข้อความอีเมลยืนยัน', ref: 'ตัวอย่าง: ticket #1219' }] };
    claims[sys[1].id] = { share: 50, tasks: [{ id: nid(), title: '', ref: '' }] };
    var months = {}; months[m] = { systems: sys, claims: claims };
    return { example: true, month: m, profile: { name: '', dept: '', fixRate: 8000, capMode: 'cap' }, months: months };
  }
  function migrate(s) {
    Object.keys(s.months).forEach(function (k) {
      var cl = (s.months[k] && s.months[k].claims) || {};
      Object.keys(cl).forEach(function (id) {
        var c = cl[id];
        if (!Array.isArray(c.tasks)) c.tasks = [{ id: nid(), title: c.note || '', ref: '' }];
        delete c.note;
      });
    });
    return s;
  }
  function loadState() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.profile && s.months && validMonth(s.month)) return migrate(s);
      }
    } catch (e) { /* ignore */ }
    return seedState();
  }
  var state = loadState();
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }
  function cur() {
    if (!state.months[state.month]) state.months[state.month] = { systems: [], claims: {} };
    return state.months[state.month];
  }

  function compute() {
    var M = cur(), lines = [];
    M.systems.forEach(function (s) {
      var c = M.claims[s.id]; if (!c) return;
      var share = Math.max(0, Math.min(100, parseFloat(c.share) || 0));
      var rate = PRICE[s.size] || 0;
      var tasks = (c.tasks || []).filter(function (t) { return (t.title || '').trim() || (t.ref || '').trim(); })
        .map(function (t) { return { title: (t.title || '').trim(), ref: (t.ref || '').trim() }; });
      lines.push({ id: s.id, name: s.name, size: s.size, rate: rate, share: share, tasks: tasks, amount: round2(rate * share / 100) });
    });
    var total = round2(lines.reduce(function (a, l) { return a + l.amount; }, 0));
    var fix = +state.profile.fixRate || 0;
    var cap = state.profile.capMode === 'cap' && fix > 0;
    var net = cap ? Math.min(total, fix) : total;

    });
    rows.push([], ['', '', '', '', '', 'รวมตามอัตรา', c.total], ['', '', '', '', '', 'Fix rate', c.fix || ''], ['', '', '', '', '', 'ยอดเบิกสุทธิ์', c.net], ['', '', '', '', '', 'ตัวอักษร', bahtText(c.net)]);
    return rows;
  }
  function toCsv() {
    return '﻿' + tableRows().map(function (r) {
      return r.map(function (v) { v = String(v == null ? '' : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',');
    }).join('\r\n');
  }
  function toTsv() { return tableRows().map(function (r) { return r.map(function (v) { return String(v == null ? '' : v).replace(/[\t\r\n]+/g, ' '); }).join('\t'); }).join('\n'); }
  function docFile() {
    var css = document.getElementById('doc-css').textContent;
    return '<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ใบเบิก P4P ' + esc(fmtMonth(state.month)) + '</title>' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@700&display=swap">' +
      '<style>@page{size:A4;margin:12mm}body{margin:0;background:#e9ece9}.doc{max-width:190mm;margin:12px auto}@media print{body{background:#fff}.doc{margin:0;padding:0;max-width:none}}' + css + '</style></head><body>' + docInner(compute()) + '</body></html>';
  }
  function saveFile(filename, data, okMsg) {
    var cl = window.claude;
    if (!cl || !cl.use) { toast('บันทึกไฟล์ในหน้านี้ไม่ได้ ใช้ปุ่มคัดลอกตารางแทน'); return; }
    cl.use('downloads').then(function (dl) {
      if (!dl) { toast('บันทึกไฟล์ในหน้านี้ไม่ได้ ใช้ปุ่มคัดลอกตารางแทน'); return; }
      return dl.save({ filename: filename, data: data }).then(function () { toast(okMsg); }, function (e) {
        toast(e && e.code === 'declined' ? 'ยกเลิกการบันทึก' : 'บันทึกไฟล์ไม่สำเร็จ (' + ((e && e.code) || 'error') + ')');
      });
    }, function () { toast('บันทึกไฟล์ไม่สำเร็จ'); });
  }

  // ---------- events ----------
  function setStatus(msg) { var s = document.getElementById('sys-status'); if (s) s.textContent = msg; }
  function importLines(text) {
    var M = cur(), added = 0, skipped = 0;
    text.split(/\r?\n/).forEach(function (line) {
      line = line.trim(); if (!line) return;
      var m = line.match(/^(.*?)[\t,;]+\s*(SS|S|M|L|XL)\s*$/i);
      if (m && m[1].trim()) { M.systems.push({ id: nid(), name: m[1].trim(), size: m[2].toUpperCase() }); added += 1; } else skipped += 1;
    });
    return { added: added, skipped: skipped };
  }

  document.addEventListener('input', function (e) {
    var t = e.target, b = t.dataset && t.dataset.bind; if (!b) return;
    var M = cur(), id = t.dataset.id;
    if (b === 'name' || b === 'dept') state.profile[b] = t.value;
    else if (b === 'fixRate') state.profile.fixRate = Math.max(0, parseFloat(t.value) || 0);
    else if (b === 'share') { if (M.claims[id]) M.claims[id].share = t.value; }
    else if (b === 'ttitle' || b === 'tref') {
      var cc = M.claims[id], tk = cc && cc.tasks.filter(function (x) { return x.id === t.dataset.tid; })[0];
      if (tk) tk[b === 'ttitle' ? 'title' : 'ref'] = t.value;
    }
    else if (b === 'sysname') { var s = M.systems.filter(function (x) { return x.id === id; })[0]; if (s) s.name = t.value; }
    else return;
    persist(); updateDerived();
  });

  document.addEventListener('change', function (e) {
    var t = e.target, M = cur();
    if (t.dataset.act === 'toggle') {
      var id = t.dataset.id;
      if (t.checked) M.claims[id] = { share: 100, tasks: [{ id: nid(), title: '', ref: '' }] }; else delete M.claims[id];
      persist(); render('chk-' + id); return;
    }
    var b = t.dataset.bind;
    if (b === 'month') {
      if (!validMonth(t.value)) { toast('กรอกเดือนในรูปแบบ ปปปป-ดด'); return; }
      state.month = t.value; cur(); persist(); render();
    } else if (b === 'capMode') { state.profile.capMode = t.value; persist(); updateDerived(); }
    else if (b === 'syssize') {
      var s = M.systems.filter(function (x) { return x.id === t.dataset.id; })[0]; if (s) s.size = t.value;
      persist(); updateDerived();
    }
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'add-form') return;
    e.preventDefault();
    var n = document.getElementById('add-name'), sz = document.getElementById('add-size');
    if (!n.value.trim()) return;
    cur().systems.push({ id: nid(), name: n.value.trim(), size: sz.value });
    persist(); render('add-name');
  });

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null; if (!el) return;
    var act = el.dataset.act, M = cur();
    if (act === 'go') { location.hash = el.dataset.go; return; }
    if (act === 'clear-example') {
      state = { example: false, month: nowMonth(), profile: { name: state.profile.name, dept: state.profile.dept, fixRate: 0, capMode: 'cap' }, months: {} };
      cur(); persist(); render(); toast('ล้างข้อมูลตัวอย่างแล้ว'); return;
    }
    if (act === 'add-task') {
      var cl = M.claims[el.dataset.id];
      if (cl) { var nt = { id: nid(), title: '', ref: '' }; cl.tasks.push(nt); persist(); render('tt-' + nt.id); }
      return;
    }
    if (act === 'del-task') {
      var cl2 = M.claims[el.dataset.id];
      if (cl2) {
        cl2.tasks = cl2.tasks.length > 1 ? cl2.tasks.filter(function (x) { return x.id !== el.dataset.tid; }) : [{ id: nid(), title: '', ref: '' }];
        persist(); render();
      }
      return;
    }
    if (act === 'del-sys') {
      M.systems = M.systems.filter(function (s) { return s.id !== el.dataset.id; }); delete M.claims[el.dataset.id];
      persist(); render(); return;
    }
    if (act === 'import') {
      var ta = document.getElementById('bulk'), r = importLines(ta.value);
      persist(); render();
      setStatus('เพิ่ม ' + r.added + ' ระบบ' + (r.skipped ? ' ข้าม ' + r.skipped + ' บรรทัดที่ไม่มีขนาด (SS S M L XL)' : ''));
      return;
    }
    if (act === 'copy-systems') {
      if (!M.systems.length) { toast('ยังไม่มีรายการให้คัดลอก'); return; }
      copyText(M.systems.map(function (s) { return s.name + ', ' + s.size; }).join('\n'), 'คัดลอกรายการระบบแล้ว ส่งให้เพื่อนวางในช่องนำเข้าได้'); return;
    }
    if (act === 'copy-prev') {
      var from = state.months[el.dataset.from];
      from.systems.forEach(function (s) { M.systems.push({ id: nid(), name: s.name, size: s.size }); });
      persist(); render(); setStatus('คัดลอก ' + from.systems.length + ' ระบบจาก ' + fmtMonth(el.dataset.from) + ' แล้ว แก้ชื่อและขนาดให้ตรงกับเดือนนี้'); return;
    }
    if (act === 'copy-table') { copyText(toTsv(), 'คัดลอกตารางแล้ว วางใน Excel หรือ Word ได้'); return; }
    if (act === 'save-csv') { saveFile('P4P-' + state.month + '.csv', toCsv(), 'บันทึกไฟล์ CSV แล้ว'); return; }
    if (act === 'save-html') { saveFile('P4P-' + state.month + '.html', docFile(), 'บันทึกเอกสารแล้ว เปิดไฟล์แล้วกด Ctrl+P เพื่อพิมพ์หรือบันทึกเป็น PDF'); return; }
  });

  window.addEventListener('hashchange', function () { render(); });
  render();
})();
</script>

</body></html>
